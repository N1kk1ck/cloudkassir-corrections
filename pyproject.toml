[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudkassir-corrections"
version = "0.1.0"
description = "Prepare and review CloudKassir correction receipts from CSV/XLSX for any configured organizations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "PyYAML>=6,<7", "requests>=2.31,<3", "openpyxl>=3.1,<4"]

[project.scripts]
cloudkassir-corrections = "receipt_tool.cli:main"

[tool.setuptools.packages.find]
include = ["receipt_tool*"]

[tool.setuptools.package-data]
receipt_tool = ["templates/*.html", "static/*.css"]
